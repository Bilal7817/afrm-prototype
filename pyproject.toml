[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "afrm"
version = "1.0.0"
description = "Aircraft Fuel and Range Management (AFRM) prototype - simulated, non-operational"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Bilal" }]
# Runtime uses the Python standard library only (no third-party dependencies).
dependencies = []

[project.scripts]
afrm = "afrm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "bench"]

[tool.ruff.lint]
# E/F: pycodestyle + Pyflakes (PEP 8, undefined names, unused imports)
# B: flake8-bugbear (likely bugs)   UP: pyupgrade (modern syntax)
# N: pep8-naming                    SIM: flake8-simplify
select = ["E", "F", "B", "UP", "N", "SIM"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["src", "tests", "bench"]

# NumPy is a benchmark-only dependency and is not installed in CI.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]   # any warning fails the test run
markers = ["req(*ids): requirement IDs verified by the test (traceability)"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["afrm"]

[tool.coverage.report]
show_missing = true
fail_under = 90
